[project]
name = "jobs-matcher"
version = "0.1.0"
description = "Automated vacancy parser, AI analyzer, and Telegram bot"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "celery[rabbitmq]>=5.7.0",
    "curl-cffi>=0.17.0",
    "fastapi>=0.162.0",
    "loguru>=0.7.3",
    "lxml>=6.1.3",
    "playwright>=1.64.1",
    "playwright-stealth>=2.0.3",
    "pydantic>=2.14.3",
    "pydantic-ai-slim[anthropic,google,openai,retries]>=2.68.0",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "pytz>=2026.6",
    "sqlalchemy>=2.1.8",
    "tenacity>=8.2.3,<9.2.0",
    "termcolor>=3.3.0",
    "ua-generator>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.4",
]

[tool.uv]
package = false          # application, not a library: no build step
default-groups = ["dev"] # `uv sync` installs dev tools locally

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "F", "I",
    "B", "UP", "SIM"
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
