# celery monitoring: http://127.0.0.1:5555
services:
  flower:
    image: mher/flower:2.0
    container_name: jobs-matcher-flower
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL: amqp://${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}@rabbitmq:5672//
      # queue lengths in the ui come from the rabbitmq management api
      FLOWER_BROKER_API: http://${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}@rabbitmq:15672/api/
      FLOWER_PERSISTENT: "True"
      FLOWER_DB: /data/flower.db
      TZ: Europe/Kiev
    ports:
      - "127.0.0.1:5555:5555"
    volumes:
      - flower-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  flower-data:
