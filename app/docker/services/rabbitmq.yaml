services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: jobs-matcher-rabbitmq
    restart: unless-stopped
    hostname: rabbitmq  # data dir is per node name, keep it stable
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?set RABBITMQ_USERNAME in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      TZ: Europe/Kiev
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # permits the transient queues celery events / flower need (see the file)
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/20-celery.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  rabbitmq-data:
