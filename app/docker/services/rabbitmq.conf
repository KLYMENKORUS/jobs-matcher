# Extra RabbitMQ config, mounted into /etc/rabbitmq/conf.d (loaded after the image defaults).

# rabbitmq 4.x refuses transient (non-durable) non-exclusive queues by default, but celery
# declares exactly those: the event queues flower consumes (celeryev.*) and the
# remote-control reply queues (*.pidbox). Without this, flower logs
# "Feature `transient_nonexcl_queues` is deprecated" and shows no workers.
deprecated_features.permit.transient_nonexcl_queues = true
